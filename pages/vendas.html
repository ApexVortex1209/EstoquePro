<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estoque Pro - Vendas</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <div class="container">
        <div data-include="sidebar"></div>
        <main class="content">
            <header class="page-header vendas-header">
                <div class="vendas-titulo">
                    <img class="vendas-icone" src="../assets/icone-vendas.jpg" alt="Ícone de vendas">
                    <h1>Vendas</h1>
                </div>
            </header>

            <section class="cards">
                <div class="card">
                    <h3>Vendas do dia</h3>
                    <p id="vendasDia">R$ 0,00</p>
                </div>
                <div class="card">
                    <h3>Produtos vendidos</h3>
                    <p id="produtosVendidos">0</p>
                </div>
                <div class="card">
                    <h3>Clientes atendidos</h3>
                    <p id="clientesAtendidos">0</p>
                </div>
            </section>

            <section class="venda-panel">
                <div class="venda-form-box">
                    <h2>Registrar nova venda</h2>

                    <form id="formVenda" class="form-venda">
                        <div class="campo-duplo">
                            <div>
                                <label for="clienteVenda">Cliente</label>
                                <input type="text" id="clienteVenda" list="listaClientesVendas" placeholder="Nome do cliente" required>
                                <datalist id="listaClientesVendas"></datalist>
                            </div>
                            <div>
                                <label for="formaPagamento">Forma de pagamento</label>
                                <select id="formaPagamento" required>
                                    <option value="Dinheiro">Dinheiro</option>
                                    <option value="Cartão de Crédito">Cartão de Crédito</option>
                                    <option value="Cartão de Débito">Cartão de Débito</option>
                                    <option value="Pix">Pix</option>
                                </select>
                            </div>
                        </div>

                        <div class="campo-duplo">
                            <div>
                                <label for="produtoVenda">Produto</label>
                                <select id="produtoVenda" required></select>
                            </div>
                            <div>
                                <label for="quantidadeVenda">Quantidade</label>
                                <input type="number" id="quantidadeVenda" min="1" value="1" required>
                            </div>
                        </div>

                        <div class="campo-duplo">
                            <div>
                                <label for="precoVendaAtual">Preço unitário</label>
                                <input type="number" id="precoVendaAtual" min="0" step="0.01" value="0">
                            </div>
                            <div>
                                <label for="descontoVenda">Desconto (R$)</label>
                                <input type="number" id="descontoVenda" min="0" step="0.01" value="0">
                            </div>
                        </div>

                        <div class="acao-venda">
                            <button type="submit" class="btn-primary">Adicionar item</button>
                        </div>
                    </form>
                </div>

                <div class="venda-resumo-box">
                    <h2>Resumo da venda</h2>
                    <div id="itensVenda" class="itens-venda"></div>

                    <div class="total-venda">
                        <span>Subtotal</span>
                        <strong id="subtotalVenda">R$ 0,00</strong>
                    </div>
                    <div class="total-venda total-final">
                        <span>Total</span>
                        <strong id="totalVenda">R$ 0,00</strong>
                    </div>

                    <button type="button" id="finalizarVenda" class="btn-success">Finalizar venda</button>
                </div>
            </section>

            <section class="lista-vendas">
                <h2>Histórico de vendas</h2>
                <table>
                    <thead>
                        <tr>
                            <th>Cliente</th>
                            <th>Produtos</th>
                            <th>Pagamento</th>
                            <th>Data</th>
                            <th>Total</th>
                            <th>Ações</th>
                        </tr>
                    </thead>
                    <tbody id="historicoVendas"></tbody>
                </table>
            </section>
        </main>
    </div>
    <script src="../js/include-partials.js"></script>
    <script src="../js/vendas.js"></script>
</body>
</html>
