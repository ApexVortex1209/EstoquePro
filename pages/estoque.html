<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estoque Pro - Estoque</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <div class="container">
        <div data-include="sidebar"></div>

        <main class="content">
            <header class="page-header estoque-header">
                <div class="estoque-titulo">
                    <img class="estoque-icone" src="../assets/icone-estoque.jpeg" alt="Ícone de estoque">
                    <h1>Movimentação de Estoque</h1>
                </div>
            </header>

            <section class="form-movimentacao">
                <h2>Nova movimentação</h2>
                <form id="formMovimentacao">
                    <label>Produto</label>
                    <select id="produtoMovimentacao" required></select>
                    <label>Tipo</label>
                    <select id="tipoMovimentacao">
                        <option value="entrada">Entrada</option>
                        <option value="saida">Saída</option>
                        <option value="ajuste">Ajuste</option>
                    </select>
                    <label>Quantidade</label>
                    <input type="number" id="quantidadeMovimentacao" min="1" required>
                    <label>Motivo</label>
                    <input type="text" id="motivoMovimentacao" placeholder="Ex.: Compra de fornecedor">
                    <button type="submit">Registrar Movimentação</button>
                </form>
            </section>

            <section class="lista-movimentacoes">
                <h2>Histórico</h2>
                <table>
                    <thead>
                        <tr>
                            <th>Data</th>
                            <th>Produto</th>
                            <th>Tipo</th>
                            <th>Quantidade</th>
                            <th>Motivo</th>
                            <th>Ações</th>
                        </tr>
                    </thead>
                    <tbody id="listaMovimentacoes"></tbody>
                </table>
            </section>
        </main>
    </div>

    <script src="../js/include-partials.js"></script>
    <script src="../js/estoque.js"></script>
</body>
</html>
