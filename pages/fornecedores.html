<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estoque Pro - Fornecedores</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <div class="container">
        <div data-include="sidebar"></div>
        <main class="content fornecedores-page">
            <header class="page-header fornecedores-header">
                <div class="fornecedores-titulo">
                    <img class="fornecedores-icone" src="../assets/icone-fornecedores.jpeg" alt="Ícone de fornecedores">
                    <h1>Fornecedores</h1>
                </div>
            </header>

            <section class="cadastro-cliente">
                <h2>Cadastro de fornecedor</h2>
                <form id="formFornecedor" class="form-venda">
                    <div class="campo-duplo">
                        <div>
                            <label for="nomeFornecedor">Nome</label>
                            <input type="text" id="nomeFornecedor" required>
                        </div>
                        <div>
                            <label for="empresaFornecedor">Empresa</label>
                            <input type="text" id="empresaFornecedor" required>
                        </div>
                    </div>

                    <div class="campo-duplo">
                        <div>
                            <label for="emailFornecedor">E-mail</label>
                            <input type="email" id="emailFornecedor" required>
                        </div>
                        <div>
                            <label for="telefoneFornecedor">Telefone</label>
                            <input type="tel" id="telefoneFornecedor" placeholder="(00) 00000-0000">
                        </div>
                    </div>

                    <div class="acao-venda">
                        <button type="submit" id="btnSalvarFornecedor" class="btn-primary">Cadastrar Fornecedor</button>
                    </div>
                </form>
            </section>

            <section class="lista-clientes">
                <h2>Fornecedores cadastrados</h2>
                <table>
                    <thead>
                        <tr><th>Nome</th><th>Empresa</th><th>E-mail</th><th>Telefone</th><th>Data</th><th>Ações</th></tr>
                    </thead>
                    <tbody id="listaFornecedores"></tbody>
                </table>
            </section>
        </main>
    </div>
    <script src="../js/include-partials.js"></script>
    <script src="../js/fornecedores.js"></script>
</body>
</html>
