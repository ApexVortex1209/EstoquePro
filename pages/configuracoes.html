<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estoque Pro - Configurações</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <div class="container">
        <div data-include="sidebar"></div>
        <main class="content config-page">
            <header class="page-header configuracoes-header">
                <div class="configuracoes-titulo">
                    <img class="configuracoes-icone" src="../assets/icone-configuracoes.jpeg" alt="Ícone de configurações">
                    <h1>Configurações</h1>
                </div>
            </header>

            <section class="cards">
                <div class="card">
                    <h3>Empresa</h3>
                    <p id="resumoEmpresa">Estoque Pro</p>
                </div>
                <div class="card">
                    <h3>Estoque mínimo</h3>
                    <p id="resumoEstoque">10 itens</p>
                </div>
                <div class="card">
                    <h3>Desconto padrão</h3>
                    <p id="resumoDesconto">5%</p>
                </div>
            </section>

            <section class="venda-panel">
                <div class="venda-form-box">
                    <h2>Dados da empresa</h2>

                    <form id="formConfiguracoes" class="form-venda">
                        <div class="campo-duplo">
                            <div>
                                <label for="nomeLoja">Nome da loja</label>
                                <input type="text" id="nomeLoja" placeholder="Estoque Pro">
                            </div>
                            <div>
                                <label for="emailLoja">E-mail principal</label>
                                <input type="email" id="emailLoja" placeholder="contato@estoquepro.com">
                            </div>
                        </div>

                        <div class="campo-duplo">
                            <div>
                                <label for="telefoneLoja">Telefone</label>
                                <input type="text" id="telefoneLoja" placeholder="(11) 99999-9999">
                            </div>
                            <div>
                                <label for="enderecoLoja">Endereço</label>
                                <input type="text" id="enderecoLoja" placeholder="Rua da loja, 123">
                            </div>
                        </div>

                        <div class="campo-duplo">
                            <div>
                                <label for="descontoPadrao">Desconto padrão (%)</label>
                                <input type="number" id="descontoPadrao" min="0" max="100" step="0.01" value="5">
                            </div>
                            <div>
                                <label for="estoqueMinimo">Estoque mínimo</label>
                                <input type="number" id="estoqueMinimo" min="0" step="1" value="10">
                            </div>
                        </div>

                        <div class="campo-duplo">
                            <div>
                                <label for="temaSistema">Tema</label>
                                <select id="temaSistema">
                                    <option value="escuro">Escuro</option>
                                    <option value="claro">Claro</option>
                                </select>
                            </div>
                            <div>
                                <label for="alertaEstoque">Alerta de estoque</label>
                                <select id="alertaEstoque">
                                    <option value="true">Ativado</option>
                                    <option value="false">Desativado</option>
                                </select>
                            </div>
                        </div>

                        <div class="campo-duplo">
                            <div>
                                <label for="emailDono">E-mail do dono</label>
                                <input type="email" id="emailDono" placeholder="dono@estoquepro.com">
                            </div>
                            <div>
                                <label for="loginPadrao">Acesso padrão</label>
                                <select id="loginPadrao">
                                    <option value="owner">Dono</option>
                                    <option value="manager">Gerente</option>
                                    <option value="employee">Funcionário</option>
                                </select>
                            </div>
                        </div>

                        <div class="acao-venda">
                            <button type="submit" class="btn-primary">Salvar configurações</button>
                            <button type="button" id="resetConfiguracoes" class="btn-secondary">Restaurar padrão</button>
                        </div>
                    </form>
                </div>
            </section>
        </main>
    </div>
    <script src="../js/include-partials.js"></script>
    <script src="../js/configuracoes.js"></script>
</body>
</html>
